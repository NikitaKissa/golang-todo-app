paths:
  /statistics:
    get:
      description: Get statistics about tasks
      parameters:
      - description: User Id
        in: query
        name: user_id
        type: integer
      - description: From [YYYY-MM-DD]
        in: query
        name: from
        type: string
      - description: To [YYYY-MM-DD]
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully got statistics
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_NikitaKissa_golang-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Get statistics
      tags:
      - statistics
  /task/{task_id}:
    patch:
      consumes:
      - application/json
      description: |-
        Patch task in system
        ### Three-state logic of fields updating
        1. **Field is unsigned**: `description` is ignored
        2. **Field is provided**: `description` is updated
        3. **Field is null**: `description` is deleted
        **Invalid state:** `completed`/`title` set to null
      parameters:
      - description: Task id
        in: path
        name: task_id
        required: true
        type: integer
      - description: PatchTaskRequest request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully patched task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_NikitaKissa_golang-todo-app_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_NikitaKissa_golang-todo-app_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_NikitaKissa_golang-todo-app_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_NikitaKissa_golang-todo-app_internal_core_transport_http_response.ErrorResponse'
      summary: Patch task
      tags:
      - tasks
